<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Work | MANGART</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <style>
    .work-detail {
      max-width: 980px;
    }

    .work-header {
      margin-bottom: 64px;
    }

    .work-title {
      max-width: 900px;
      margin: 0 0 28px;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .work-metadata {
      margin: 0;
      color: var(--grey);
      font-size: 16px;
      line-height: 1.75;
    }

    .work-metadata span {
      display: block;
    }

    .work-text {
      max-width: 780px;
      margin-bottom: 82px;
      font-size: 19px;
      line-height: 1.7;
    }

    .work-text p {
      margin: 0;
    }

    .work-images {
      display: flex;
      flex-direction: column;
      gap: 76px;
    }

    .work-image-figure {
      margin: 0;
    }

    .work-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: var(--white);
    }

    .work-image-placeholder {
      width: 100%;
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #d4d4d4;
      background: var(--white);
      color: #aaaaaa;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .work-image-caption {
      margin-top: 14px;
      color: var(--soft-grey);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .work-not-found {
      max-width: 760px;
    }

    .work-not-found h1 {
      margin: 0 0 20px;
      font-size: 36px;
    }

    .work-not-found p {
      color: var(--grey);
      font-size: 17px;
      line-height: 1.6;
    }

    .back-to-works {
      display: inline-block;
      position: relative;
      margin-top: 30px;
      padding-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .back-to-works::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      background: var(--black);
    }

    .privacy-footer-link {
      display: inline-block;
      margin-top: 10px;
      color: #999999;
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    .privacy-footer-link:hover {
      color: #111111;
    }

    .mobile-privacy-footer {
      display: none;
    }

    @media (max-width: 760px) {
      .work-header {
        margin-bottom: 48px;
      }

      .work-title {
        font-size: 32px;
      }

      .work-text {
        margin-bottom: 58px;
        font-size: 17px;
      }

      .work-images {
        gap: 46px;
      }

      .work-image-placeholder {
        min-height: 420px;
      }

      .mobile-privacy-footer {
        display: block;
        margin-top: 60px;
        padding-top: 24px;
        border-top: 1px solid #e4e4e4;
      }

      .mobile-privacy-footer a {
        color: #999999;
        font-size: 11px;
        letter-spacing: 0.03em;
        text-decoration: none;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <a
      class="site-logo"
      href="index.html"
      aria-label="Zur Startseite"
      data-aria-de="Zur Startseite"
      data-aria-en="Go to homepage"
    >
      <span class="site-logo-main">MANGART</span>
      <span class="site-logo-japanese">マンガアート</span>
    </a>

    <div class="header-controls">

      <div
        class="language-switch"
        aria-label="Sprache auswählen"
        data-aria-de="Sprache auswählen"
        data-aria-en="Select language"
      >

        <button
          class="language-button active"
          id="languageDe"
          type="button"
          aria-pressed="true"
        >
          DE
        </button>

        <span class="language-divider">|</span>

        <button
          class="language-button"
          id="languageEn"
          type="button"
          aria-pressed="false"
        >
          EN
        </button>

      </div>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Menü öffnen"
        aria-expanded="false"
        data-open-de="Menü öffnen"
        data-close-de="Menü schließen"
        data-open-en="Open menu"
        data-close-en="Close menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </header>

  <aside class="sidebar" id="sidebar">

    <nav class="main-navigation">

      <a href="index.html" data-de="Home" data-en="Home">
        Home
      </a>

      <a
        class="active"
        href="works.html"
        data-de="Werke"
        data-en="Works"
      >
        Werke
      </a>

      <a href="position.html" data-de="Position" data-en="Position">
        Position
      </a>

      <a href="about.html" data-de="Über mich" data-en="About">
        Über mich
      </a>

      <a
        href="exhibitions.html"
        data-de="Ausstellungen"
        data-en="Exhibitions"
      >
        Ausstellungen
      </a>

      <a href="press.html" data-de="Presse" data-en="Press">
        Presse
      </a>

      <a href="contact.html" data-de="Kontakt" data-en="Contact">
        Kontakt
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="japanese-name">バッドマン</div>
      <div>© 2026 Mangart</div>
      <div>BADMAN</div>

      <a
        class="privacy-footer-link"
        href="privacy.html"
        data-de="Datenschutz"
        data-en="Privacy"
      >
        Datenschutz
      </a>
    </div>

  </aside>

  <main class="page">

    <div class="content">

      <article class="work-detail" id="workDetail"></article>

      <div class="mobile-privacy-footer">
        <a
          href="privacy.html"
          data-de="Datenschutz"
          data-en="Privacy"
        >
          Datenschutz
        </a>
      </div>

    </div>

  </main>

  <script src="works-data.js"></script>

  <script>
    const menuButton = document.getElementById("menuButton");
    const sidebar = document.getElementById("sidebar");

    const languageDe = document.getElementById("languageDe");
    const languageEn = document.getElementById("languageEn");

    const workDetail = document.getElementById("workDetail");

    const queryParameters = new URLSearchParams(window.location.search);
    const requestedWorkId = queryParameters.get("id");

    const currentWork = window.mangartWorks.find(function (work) {
      return work.id === requestedWorkId;
    });

    let currentLanguage =
      localStorage.getItem("mangart-language") || "de";

    const imageLabels = {
      front: {
        de: "Frontansicht",
        en: "Front view"
      },

      detail: {
        de: "Detail",
        en: "Detail"
      },

      installation: {
        de: "Raumansicht",
        en: "Installation view"
      }
    };

    function updateMenuLabel() {
      const menuIsOpen = sidebar.classList.contains("open");

      const labelAttribute = menuIsOpen
        ? `data-close-${currentLanguage}`
        : `data-open-${currentLanguage}`;

      menuButton.setAttribute(
        "aria-label",
        menuButton.getAttribute(labelAttribute)
      );
    }

    function renderWork() {
      workDetail.innerHTML = "";

      if (!currentWork) {
        document.title =
          currentLanguage === "de"
            ? "Werk nicht gefunden | MANGART"
            : "Work not found | MANGART";

        workDetail.className = "work-not-found";

        const title = document.createElement("h1");
        title.textContent =
          currentLanguage === "de"
            ? "Werk nicht gefunden"
            : "Work not found";

        const text = document.createElement("p");
        text.textContent =
          currentLanguage === "de"
            ? "Das angeforderte Werk ist noch nicht im Archiv vorhanden."
            : "The requested work is not yet available in the archive.";

        const link = document.createElement("a");
        link.className = "back-to-works";
        link.href = "works.html";
        link.textContent =
          currentLanguage === "de"
            ? "Alle Werke ansehen"
            : "View all works";

        workDetail.appendChild(title);
        workDetail.appendChild(text);
        workDetail.appendChild(link);

        return;
      }

      workDetail.className = "work-detail";

      document.title =
        `${currentWork.title[currentLanguage]} | MANGART`;

      const header = document.createElement("header");
      header.className = "work-header";

      const title = document.createElement("h1");
      title.className = "work-title";
      title.textContent = currentWork.title[currentLanguage];

      const metadata = document.createElement("p");
      metadata.className = "work-metadata";

      const year = document.createElement("span");
      year.textContent = currentWork.year;

      const medium = document.createElement("span");
      medium.textContent = currentWork.medium[currentLanguage];

      const size = document.createElement("span");
      size.textContent = currentWork.size;

      metadata.appendChild(year);
      metadata.appendChild(medium);
      metadata.appendChild(size);

      header.appendChild(title);
      header.appendChild(metadata);

      const textSection = document.createElement("section");
      textSection.className = "work-text";

      const textParagraph = document.createElement("p");
      textParagraph.textContent = currentWork.text[currentLanguage];

      textSection.appendChild(textParagraph);

      const imagesSection = document.createElement("section");
      imagesSection.className = "work-images";

      currentWork.images.forEach(function (imageData) {
        const figure = document.createElement("figure");
        figure.className = "work-image-figure";

        if (imageData.src) {
          const image = document.createElement("img");

          image.className = "work-image";
          image.src = imageData.src;
          image.alt = imageData.alt[currentLanguage];
          image.loading = "lazy";

          figure.appendChild(image);
        } else {
          const placeholder = document.createElement("div");

          placeholder.className = "work-image-placeholder";
          placeholder.textContent =
            currentLanguage === "de"
              ? `${imageLabels[imageData.type].de} folgt`
              : `${imageLabels[imageData.type].en} coming soon`;

          figure.appendChild(placeholder);
        }

        const caption = document.createElement("figcaption");
        caption.className = "work-image-caption";
        caption.textContent =
          imageLabels[imageData.type][currentLanguage];

        figure.appendChild(caption);
        imagesSection.appendChild(figure);
      });

      workDetail.appendChild(header);
      workDetail.appendChild(textSection);
      workDetail.appendChild(imagesSection);
    }

    function setLanguage(language) {
      currentLanguage = language;

      document.documentElement.lang = language;

      document
        .querySelectorAll("[data-de][data-en]")
        .forEach(function (element) {
          element.textContent = element.getAttribute(`data-${language}`);
        });

      document
        .querySelectorAll("[data-aria-de][data-aria-en]")
        .forEach(function (element) {
          element.setAttribute(
            "aria-label",
            element.getAttribute(`data-aria-${language}`)
          );
        });

      const germanIsActive = language === "de";

      languageDe.classList.toggle("active", germanIsActive);
      languageEn.classList.toggle("active", !germanIsActive);

      languageDe.setAttribute(
        "aria-pressed",
        germanIsActive ? "true" : "false"
      );

      languageEn.setAttribute(
        "aria-pressed",
        germanIsActive ? "false" : "true"
      );

      localStorage.setItem("mangart-language", language);

      updateMenuLabel();
      renderWork();
    }

    languageDe.addEventListener("click", function () {
      setLanguage("de");
    });

    languageEn.addEventListener("click", function () {
      setLanguage("en");
    });

    menuButton.addEventListener("click", function () {
      const menuIsOpen = sidebar.classList.toggle("open");

      menuButton.classList.toggle("open", menuIsOpen);

      menuButton.setAttribute(
        "aria-expanded",
        menuIsOpen ? "true" : "false"
      );

      updateMenuLabel();
    });

    setLanguage(currentLanguage);
  </script>

</body>
</html>
