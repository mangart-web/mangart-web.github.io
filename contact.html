<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | MANGART</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

    <a
      class="site-logo"
      href="index.html"
      aria-label="Zur Startseite"
      data-aria-de="Zur Startseite"
      data-aria-en="Go to homepage"
    >
      <span class="site-logo-main">MANGART</span>
      <span class="site-logo-japanese">マンガアート</span>
    </a>

    <div class="header-controls">

      <div
        class="language-switch"
        aria-label="Sprache auswählen"
        data-aria-de="Sprache auswählen"
        data-aria-en="Select language"
      >

        <button
          class="language-button active"
          id="languageDe"
          type="button"
          aria-pressed="true"
        >
          DE
        </button>

        <span class="language-divider">|</span>

        <button
          class="language-button"
          id="languageEn"
          type="button"
          aria-pressed="false"
        >
          EN
        </button>

      </div>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Menü öffnen"
        aria-expanded="false"
        data-open-de="Menü öffnen"
        data-close-de="Menü schließen"
        data-open-en="Open menu"
        data-close-en="Close menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </header>

  <aside class="sidebar" id="sidebar">

    <nav class="main-navigation">

      <a href="index.html" data-de="Home" data-en="Home">
        Home
      </a>

      <a href="works.html" data-de="Werke" data-en="Works">
        Werke
      </a>

      <a href="position.html" data-de="Position" data-en="Position">
        Position
      </a>

      <a href="about.html" data-de="Über mich" data-en="About">
        Über mich
      </a>

      <a
        href="exhibitions.html"
        data-de="Ausstellungen"
        data-en="Exhibitions"
      >
        Ausstellungen
      </a>

      <a href="press.html" data-de="Presse" data-en="Press">
        Presse
      </a>

      <a
        class="active"
        href="contact.html"
        data-de="Kontakt"
        data-en="Contact"
      >
        Kontakt
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="japanese-name">バッドマン</div>
      <div>© 2026 Mangart</div>
      <div>BADMAN</div>

      <a
        class="privacy-footer-link"
        href="privacy.html"
        data-de="Datenschutz"
        data-en="Privacy"
      >
        Datenschutz
      </a>
    </div>

  </aside>

  <main class="page">

    <div class="content">

      <section class="intro">

        <h1
          class="intro-lead"
          style="margin-top: 0; margin-bottom: 24px;"
          data-de="Kontakt"
          data-en="Contact"
        >
          Kontakt
        </h1>

        <p
          class="intro-main"
          style="margin-bottom: 64px;"
          data-de="Für Anfragen zu Werken, Ankäufen, Ausstellungen oder Kooperationen."
          data-en="For enquiries regarding works, acquisitions, exhibitions, or collaborations."
        >
          Für Anfragen zu Werken, Ankäufen, Ausstellungen oder Kooperationen.
        </p>

        <div class="contact-layout">

          <form id="contactForm">

            <!-- Web3Forms -->
            <input
              type="hidden"
              name="access_key"
              value="0de6fda5-7a1c-40d3-9e6d-ba6a7924e455"
            >

            <input
              type="hidden"
              name="from_name"
              value="MANGART"
            >

            <input
              type="hidden"
              name="subject"
              id="formSubject"
              value="Neue Anfrage über mangart.ch"
            >

            <!-- Unsichtbarer Spam-Schutz -->
            <input
              type="checkbox"
              name="botcheck"
              tabindex="-1"
              autocomplete="off"
              style="display: none;"
            >

            <div class="contact-field">

              <label
                for="contactName"
                data-de="Name (optional)"
                data-en="Name (optional)"
              >
                Name (optional)
              </label>

              <input
                id="contactName"
                name="name"
                type="text"
                autocomplete="name"
              >

            </div>

            <div class="contact-field">

              <label
                for="contactEmail"
                data-de="E-Mail"
                data-en="Email"
              >
                E-Mail
              </label>

              <input
                id="contactEmail"
                name="email"
                type="email"
                autocomplete="email"
                required
              >

            </div>

            <div class="contact-field">

              <label
                for="contactMessage"
                data-de="Nachricht"
                data-en="Message"
              >
                Nachricht
              </label>

              <textarea
                id="contactMessage"
                name="message"
                rows="8"
                required
              ></textarea>

            </div>

            <button
              class="contact-submit"
              id="submitButton"
              type="submit"
              data-de="Senden"
              data-en="Send"
            >
              Senden
            </button>

            <p
              id="formResult"
              class="form-result"
              aria-live="polite"
            ></p>

          </form>

          <div class="contact-info">

            <div class="contact-info-block">

              <p
                class="contact-info-title"
                data-de="Künstler"
                data-en="Artist"
              >
                Künstler
              </p>

              <p class="intro-sub contact-info-text">
                BADMAN
              </p>

            </div>

            <div class="contact-info-block">

              <p
                class="contact-info-title"
                data-de="E-Mail"
                data-en="Email"
              >
                E-Mail
              </p>

              <p class="intro-sub contact-info-text">
                <a
                  href="mailto:info@mangart.ch"
                  class="contact-link"
                >
                  info@mangart.ch
                </a>
              </p>

            </div>

            <div class="contact-info-block">

              <p class="contact-info-title">
                Instagram
              </p>

              <p class="intro-sub contact-info-text">
                <a
                  href="https://www.instagram.com/mangart4life/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="contact-link"
                >
                  @mangart4life
                </a>
              </p>

            </div>

          </div>

        </div>

      </section>

      <div class="mobile-privacy-footer">
        <a
          href="privacy.html"
          data-de="Datenschutz"
          data-en="Privacy"
        >
          Datenschutz
        </a>
      </div>

    </div>

  </main>

  <style>

    .contact-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.8fr);
      gap: 72px;
      align-items: start;
    }

    .contact-field {
      margin-bottom: 26px;
    }

    .contact-field label {
      display: block;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .contact-field input,
    .contact-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border: 1px solid #d8d8d8;
      border-radius: 0;
      background: #ffffff;
      color: #111111;
      font: inherit;
    }

    .contact-field input {
      min-height: 58px;
    }

    .contact-field textarea {
      min-height: 190px;
      resize: vertical;
    }

    .contact-field input:focus,
    .contact-field textarea:focus {
      outline: 1px solid #111111;
      outline-offset: 0;
      border-color: #111111;
    }

    .contact-submit {
      min-width: 160px;
      padding: 17px 28px;
      border: 1px solid #111111;
      border-radius: 0;
      background: #111111;
      color: #ffffff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .contact-submit:hover {
      opacity: 0.82;
    }

    .contact-submit:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .form-result {
      min-height: 22px;
      margin: 18px 0 0;
      color: var(--grey);
      font-size: 13px;
      line-height: 1.6;
    }

    .form-result.success {
      color: #111111;
      font-weight: 600;
    }

    .form-result.error {
      color: var(--red);
      font-weight: 600;
    }

    .contact-info-block {
      margin-bottom: 38px;
    }

    .contact-info-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .contact-info-text {
      margin: 0;
    }

    .contact-link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .privacy-footer-link {
      display: inline-block;
      margin-top: 10px;
      color: #999999;
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    .privacy-footer-link:hover {
      color: #111111;
    }

    .mobile-privacy-footer {
      display: none;
    }

    @media (max-width: 820px) {
      .contact-layout {
        grid-template-columns: 1fr;
        gap: 56px;
      }
    }

    @media (max-width: 760px) {
      .mobile-privacy-footer {
        display: block;
        margin-top: 60px;
        padding-top: 24px;
        border-top: 1px solid #e4e4e4;
      }

      .mobile-privacy-footer a {
        color: #999999;
        font-size: 11px;
        letter-spacing: 0.03em;
        text-decoration: none;
      }
    }

  </style>

  <script>

    const menuButton = document.getElementById("menuButton");
    const sidebar = document.getElementById("sidebar");

    const languageDe = document.getElementById("languageDe");
    const languageEn = document.getElementById("languageEn");

    const contactForm = document.getElementById("contactForm");
    const submitButton = document.getElementById("submitButton");
    const formResult = document.getElementById("formResult");
    const formSubject = document.getElementById("formSubject");

    const translatableElements = document.querySelectorAll(
      "[data-de][data-en]"
    );

    const ariaTranslatableElements = document.querySelectorAll(
      "[data-aria-de][data-aria-en]"
    );

    let currentLanguage =
      localStorage.getItem("mangart-language") || "de";

    function updateMenuLabel() {
      const menuIsOpen = sidebar.classList.contains("open");

      const labelAttribute = menuIsOpen
        ? `data-close-${currentLanguage}`
        : `data-open-${currentLanguage}`;

      menuButton.setAttribute(
        "aria-label",
        menuButton.getAttribute(labelAttribute)
      );
    }

    function setLanguage(language) {
      currentLanguage = language;

      document.documentElement.lang = language;

      translatableElements.forEach(function (element) {
        element.textContent = element.getAttribute(`data-${language}`);
      });

      ariaTranslatableElements.forEach(function (element) {
        element.setAttribute(
          "aria-label",
          element.getAttribute(`data-aria-${language}`)
        );
      });

      const germanIsActive = language === "de";

      languageDe.classList.toggle("active", germanIsActive);
      languageEn.classList.toggle("active", !germanIsActive);

      languageDe.setAttribute(
        "aria-pressed",
        germanIsActive ? "true" : "false"
      );

      languageEn.setAttribute(
        "aria-pressed",
        germanIsActive ? "false" : "true"
      );

      localStorage.setItem("mangart-language", language);

      formSubject.value =
        language === "de"
          ? "Neue Anfrage über mangart.ch"
          : "New enquiry via mangart.ch";

      formResult.textContent = "";
      formResult.className = "form-result";

      updateMenuLabel();
    }

    languageDe.addEventListener("click", function () {
      setLanguage("de");
    });

    languageEn.addEventListener("click", function () {
      setLanguage("en");
    });

    menuButton.addEventListener("click", function () {
      const menuIsOpen = sidebar.classList.toggle("open");

      menuButton.classList.toggle("open", menuIsOpen);

      menuButton.setAttribute(
        "aria-expanded",
        menuIsOpen ? "true" : "false"
      );

      updateMenuLabel();
    });

    contactForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!contactForm.checkValidity()) {
        contactForm.reportValidity();
        return;
      }

      submitButton.disabled = true;

      formResult.className = "form-result";
      formResult.textContent =
        currentLanguage === "de"
          ? "Nachricht wird gesendet..."
          : "Sending message...";

      const formData = new FormData(contactForm);
      const formObject = Object.fromEntries(formData);
      const json = JSON.stringify(formObject);

      try {

        const response = await fetch(
          "https://api.web3forms.com/submit",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: json
          }
        );

        const result = await response.json();

        if (response.ok && result.success) {

          formResult.className = "form-result success";

          formResult.textContent =
            currentLanguage === "de"
              ? "Vielen Dank. Deine Nachricht wurde gesendet."
              : "Thank you. Your message has been sent.";

          contactForm.reset();

          formSubject.value =
            currentLanguage === "de"
              ? "Neue Anfrage über mangart.ch"
              : "New enquiry via mangart.ch";

        } else {

          throw new Error(
            result.message || "Submission failed"
          );

        }

      } catch (error) {

        console.error(error);

        formResult.className = "form-result error";

        formResult.textContent =
          currentLanguage === "de"
            ? "Die Nachricht konnte nicht gesendet werden. Bitte versuche es erneut oder schreibe direkt an info@mangart.ch."
            : "The message could not be sent. Please try again or contact info@mangart.ch directly.";

      } finally {

        submitButton.disabled = false;

      }
    });

    setLanguage(currentLanguage);

  </script>

</body>
</html>
