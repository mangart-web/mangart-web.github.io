<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Works | MANGART</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <style>
    .works-page-header {
      margin-bottom: 58px;
    }

    .works-page-title {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.025em;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 52px 22px;
    }

    .archive-card {
      display: block;
      width: 100%;
    }

    .archive-card:hover {
      opacity: 0.82;
    }

    .archive-image {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: contain;
      background: var(--white);
    }

    .archive-placeholder {
      width: 100%;
      aspect-ratio: 4 / 5;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #d4d4d4;
      background: var(--white);
      color: #aaaaaa;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .archive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .works-page-header {
        margin-bottom: 42px;
      }

      .works-page-title {
        font-size: 23px;
      }

      .archive-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <a
      class="site-logo"
      href="index.html"
      aria-label="Zur Startseite"
      data-aria-de="Zur Startseite"
      data-aria-en="Go to homepage"
    >
      <span class="site-logo-main">MANGART</span>
      <span class="site-logo-japanese">マンガアート</span>
    </a>

    <div class="header-controls">

      <div
        class="language-switch"
        aria-label="Sprache auswählen"
        data-aria-de="Sprache auswählen"
        data-aria-en="Select language"
      >

        <button
          class="language-button active"
          id="languageDe"
          type="button"
          aria-pressed="true"
        >
          DE
        </button>

        <span class="language-divider">|</span>

        <button
          class="language-button"
          id="languageEn"
          type="button"
          aria-pressed="false"
        >
          EN
        </button>

      </div>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Menü öffnen"
        aria-expanded="false"
        data-open-de="Menü öffnen"
        data-close-de="Menü schließen"
        data-open-en="Open menu"
        data-close-en="Close menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </header>

  <aside class="sidebar" id="sidebar">

    <nav class="main-navigation">

      <a href="index.html" data-de="Home" data-en="Home">
        Home
      </a>

      <a
        class="active"
        href="works.html"
        data-de="Werke"
        data-en="Works"
      >
        Werke
      </a>

      <a href="position.html" data-de="Position" data-en="Position">
        Position
      </a>

      <a href="about.html" data-de="Über mich" data-en="About">
        Über mich
      </a>

      <a
        href="exhibitions.html"
        data-de="Ausstellungen"
        data-en="Exhibitions"
      >
        Ausstellungen
      </a>

      <a href="press.html" data-de="Presse" data-en="Press">
        Presse
      </a>

      <a href="contact.html" data-de="Kontakt" data-en="Contact">
        Kontakt
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="japanese-name">バッドマン</div>
      <div>© 2026 Mangart</div>
      <div>BADMAN</div>
    </div>

  </aside>

  <main class="page">

    <div class="content">

      <section class="works-page-header">

        <h1
          class="works-page-title"
          data-de="Werke"
          data-en="Works"
        >
          Werke
        </h1>

      </section>

      <section
        class="archive-grid"
        id="archiveGrid"
        aria-label="Werksarchiv"
        data-aria-de="Werksarchiv"
        data-aria-en="Works archive"
      ></section>

    </div>

  </main>

  <script src="works-data.js"></script>

  <script>
    const menuButton = document.getElementById("menuButton");
    const sidebar = document.getElementById("sidebar");

    const languageDe = document.getElementById("languageDe");
    const languageEn = document.getElementById("languageEn");

    const archiveGrid = document.getElementById("archiveGrid");

    let currentLanguage =
      localStorage.getItem("mangart-language") || "de";

    function updateMenuLabel() {
      const menuIsOpen = sidebar.classList.contains("open");

      const labelAttribute = menuIsOpen
        ? `data-close-${currentLanguage}`
        : `data-open-${currentLanguage}`;

      menuButton.setAttribute(
        "aria-label",
        menuButton.getAttribute(labelAttribute)
      );
    }

    function renderWorks() {
      archiveGrid.innerHTML = "";

      window.mangartWorks.forEach(function (work, index) {
        const link = document.createElement("a");

        link.className = "archive-card";
        link.href = `work.html?id=${encodeURIComponent(work.id)}`;
        link.setAttribute(
          "aria-label",
          currentLanguage === "de"
            ? `${work.title.de} öffnen`
            : `Open ${work.title.en}`
        );

        if (work.cover) {
          const image = document.createElement("img");

          image.className = "archive-image";
          image.src = work.cover;
          image.alt = work.title[currentLanguage];
          image.loading = "lazy";

          link.appendChild(image);
        } else {
          const placeholder = document.createElement("div");

          placeholder.className = "archive-placeholder";
          placeholder.textContent =
            currentLanguage === "de"
              ? `Bild ${String(index + 1).padStart(2, "0")} folgt`
              : `Image ${String(index + 1).padStart(2, "0")} coming soon`;

          link.appendChild(placeholder);
        }

        archiveGrid.appendChild(link);
      });
    }

    function setLanguage(language) {
      currentLanguage = language;

      document.documentElement.lang = language;

      document
        .querySelectorAll("[data-de][data-en]")
        .forEach(function (element) {
          element.textContent = element.getAttribute(`data-${language}`);
        });

      document
        .querySelectorAll("[data-aria-de][data-aria-en]")
        .forEach(function (element) {
          element.setAttribute(
            "aria-label",
            element.getAttribute(`data-aria-${language}`)
          );
        });

      const germanIsActive = language === "de";

      languageDe.classList.toggle("active", germanIsActive);
      languageEn.classList.toggle("active", !germanIsActive);

      languageDe.setAttribute(
        "aria-pressed",
        germanIsActive ? "true" : "false"
      );

      languageEn.setAttribute(
        "aria-pressed",
        germanIsActive ? "false" : "true"
      );

      localStorage.setItem("mangart-language", language);

      updateMenuLabel();
      renderWorks();
    }

    languageDe.addEventListener("click", function () {
      setLanguage("de");
    });

    languageEn.addEventListener("click", function () {
      setLanguage("en");
    });

    menuButton.addEventListener("click", function () {
      const menuIsOpen = sidebar.classList.toggle("open");

      menuButton.classList.toggle("open", menuIsOpen);

      menuButton.setAttribute(
        "aria-expanded",
        menuIsOpen ? "true" : "false"
      );

      updateMenuLabel();
    });

    setLanguage(currentLanguage);
  </script>

</body>
</html>
